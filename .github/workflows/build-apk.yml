name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython==0.29.36" buildozer virtualenv
      - uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
      - name: Build APK
        run: |
          buildozer android debug > build.log 2>&1 || {
            echo "=== ERROR CONTEXT (lines before failure) ==="
            grep -B 90 -m1 "# Command failed" build.log | head -90
            echo "=== ERROR LINES ==="
            grep -n -i -E "error|traceback|not found|no matching" build.log | grep -v "ENVIRONMENT" | tail -30
            exit 1
          }
          tail -n 5 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: DhanOIScanner-apk
          path: bin/*.apk
